function register(){return `<h2>👤 ${t('register')}</h2><form onsubmit="saveRegister(event)">${selectField('account','role',[['candidate',t('candidate')],['company',t('company')]],role)}${field('first','first')}${field('last','last')}${selectField('sex','sex',[['female',t('female')],['male',t('male')],['other',t('other')]])}${phoneField()}${field('email','email','email')}${selectField('country','country',countries.map(c=>[c[0],c[1]+' '+c[2]]),'CL')}${field('city','city')}${field('pin','pin','password')}${button(t('save'),'','gold').replace('onclick=""','type="submit" onclick=""')}</form>${button(t('login'),"go('login')",'white')}`}
async function saveRegister(e){e.preventDefault();const d=formData(e.target);if(!/^\d{6}$/.test(d.pin))return alertMsg('Kòd la dwe genyen egzakteman 6 chif.');try{const c=await window.fb.createUserWithEmailAndPassword(window.fb.auth,d.email,d.pin);userId=c.user.uid;localStorage.djuser=userId;const u={...d,id:userId};delete u.pin;await window.fb.setDoc(window.fb.doc(window.fb.store,'profiles',userId),u);await window.fb.setDoc(window.fb.doc(window.fb.store,'users',userId),{id:userId,first:d.first,last:d.last,role:d.role,country:d.country,city:d.city});localStorage.setItem('dj_users',JSON.stringify([...db('users').filter(x=>x.id!==userId),u]));go('home')}catch(err){alertMsg('Firebase: '+err.message)}}
function login(){return `<h2>🔐 ${t('login')}</h2><form onsubmit="doLogin(event)">${field('email','email','email')}${field('pin','pin','password')}<button type="submit" class="btn gold">${t('login')}</button></form>${button(t('forgot'),"go('recover')",'white')}${button(t('register'),"go('register')",'white')}`}
async function doLogin(e){e.preventDefault();const d=formData(e.target);try{const c=await window.fb.signInWithEmailAndPassword(window.fb.auth,d.email,d.pin);userId=c.user.uid;localStorage.djuser=userId;await cloudProfile();go('home')}catch(err){alertMsg('Firebase: '+err.message)}}
function recover(){return `<h2>${t('recover')}</h2><p>Ou pral resevwa yon lyen rekiperasyon nan imèl ou.</p><form onsubmit="doRecover(event)">${field('email','email','email')}<button type="submit" class="btn gold">${t('recover')}</button></form>`}
async function doRecover(e){e.preventDefault();const d=formData(e.target);try{await window.fb.sendPasswordResetEmail(window.fb.auth,d.email);alertMsg('Si kont sa a egziste, verifye imèl ou pou chanje kòd la.');go('login')}catch(err){alertMsg('Firebase: '+err.message)}}
function post(){if(!user())return `<h2>${t('companySpace')}</h2><p>${t('login')}</p>${button(t('login'),"go('login')")}`;if(user().role!=='company')return `<div class="notice">${t('companySpace')} — ${t('company')}</div>${button(t('browseCV'),"go('candidates')")}`;return `<h2>💼 ${t('publishJob')}</h2><form onsubmit="saveJob(event)">${field('companyName','companyName')}${field('address','address')}${field('city','city', 'text',user().city)}${selectField('country','country',countries.map(c=>[c[0],c[1]+' '+c[2]]),user().country)}${field('jobType','jobType')}${field('minAge','minAge','number')}${field('maxAge','maxAge','number')}${selectField('gender','gender',[['any',t('any')],['female',t('female')],['male',t('male')]])}${selectField('education','education',[['professional',t('professional')],['university',t('university')],['doctorate',t('doctorate')],['any',t('any')]])}${phoneField(user().dial,user().phone)}<label>${t('description')}</label><textarea name="description"></textarea><button class="btn gold" type="submit">${t('publishJob')}</button></form>`}
function saveJob(e){e.preventDefault();if(!must('company'))return;const d=formData(e.target);if(+d.maxAge<+d.minAge)return alertMsg('Laj maksimòm pa ka pi piti pase laj minimòm.');put('jobs',[...db('jobs'),{...d,id:Date.now().toString(),owner:userId,created:Date.now()}]);alertMsg('Òf travay la anrejistre.');go('jobs')}
function jobItems(items){return items.length?items.map(j=>`<article class="item"><h3>💼 ${esc(j.jobType)}</h3><p><b>${esc(j.companyName)}</b> · ${esc(j.city)}, ${esc(j.country)}</p><div class="job-detail"><p><b>${t('companyName')}:</b> ${esc(j.companyName)}</p><p><b>${t('address')}:</b> ${esc(j.address)}</p><p><b>${t('city')}:</b> ${esc(j.city)}</p><p><b>${t('country')}:</b> ${esc(j.country)}</p><p><b>${t('jobType')}:</b> ${esc(j.jobType)}</p><p><b>${t('minAge')} / ${t('maxAge')}:</b> ${esc(j.minAge)}–${esc(j.maxAge)}</p><p><b>${t('gender')}:</b> ${t(j.gender)}</p><p><b>${t('education')}:</b> ${t(j.education)}</p><p><b>${t('description')}:</b> ${esc(j.description||'—')}</p><p><b>${t('phone')}:</b> ${esc(j.dial?.split(' ')[0]||'')} ${esc(j.phone)}</p></div></article>`).join(''):`<p class="muted">${t('noJobs')}</p>`}
function jobs(){const u=user();const items=db('jobs').filter(j=>(!u||j.country===u.country)&&[j.jobType,j.companyName,j.city,j.description].join(' ').toLowerCase().includes(query.toLowerCase())).reverse();return `<h2>🔎 ${t('search')}</h2><p class="notice">${lang==='ht'?'Kandida yo kapab li tout detay òf travay ki pibliye nan peyi yo.':lang==='fr'?'Les candidats peuvent consulter tous les détails des offres publiées dans leur pays.':lang==='es'?'Los postulantes pueden leer todos los detalles de las ofertas de su país.':'Candidates can read every detail of jobs posted in their country.'}</p><input placeholder="${t('filter')}" value="${esc(query)}" oninput="query=this.value;document.getElementById('jobList').innerHTML=jobItems(db('jobs').filter(j=>(!user()||j.country===user().country)&&[j.jobType,j.companyName,j.city,j.description].join(' ').toLowerCase().includes(query.toLowerCase())).reverse())"><div id="jobList">${jobItems(items)}</div>`}
function cv(){if(!mustSilent())return `<h2>${t('candidateSpace')}</h2>${button(t('login'),"go('login')")}`;if(user().role!=='candidate')return `<h2>${t('browseCV')}</h2>${button(t('browseCV'),"go('candidates')")}`;const c=db('cvs').find(x=>x.owner===userId)||{},u=user();const check=(name,value,label)=>`<label class="cv-option"><input type="checkbox" name="${name}" value="${value}" ${String(c[name]||'').includes(value)?'checked':''}>${label}</label>`;return `<div class="cv-banner">📄 ${t('createCV').toUpperCase()}</div><form id="cvForm" class="cv-form" onsubmit="saveCV(event)"><div class="notice">${c.published?t('published'):t('notPublished')}</div><div class="cv-photo"><b>📷 ${t('photo').toUpperCase()}</b>${c.photo?`<img class="photo" src="${c.photo}" alt="Photo">`:''}<input type="file" id="cvPhoto" accept="image/*"></div><div class="cv-two"><div>${field('first','first','text',c.first||u.first)}</div><div>${field('last','last','text',c.last||u.last)}</div></div><div class="cv-two"><div>${field('email','email','email',c.email||u.email)}</div><div><label>${t('phone')}</label>${phoneField(c.dial||u.dial,c.phone||u.phone).replace(/^<label[^>]*>.*?<\/label>/,'')}</div></div><div class="cv-two"><div>${field('address','address','text',c.address||u.address||'')}</div><div>${field('city','city','text',c.city||u.city)}</div></div>${field('profession','profession','text',c.profession||'')}${field('school','school','text',c.school||'')}<div class="cv-two"><div>${field('start','start','date',c.start||'')}</div><div>${field('end','end','date',c.end||'')}</div></div><div class="cv-choice"><strong>🎓 ${t('education').toUpperCase()}</strong>${check('levelProfessional','yes',t('professional'))}${check('levelUniversity','yes',t('university'))}${check('levelDoctorate','yes',t('doctorate'))}</div><div class="cv-choice"><strong>📁 ${t('certificate').toUpperCase()} / ${t('diploma').toUpperCase()} / ${t('doctorate').toUpperCase()}</strong>${check('hasCertificate','yes',t('certificate'))}${field('certificate','certificate','text',c.certificate||'',false)}${check('hasDiploma','yes',t('diploma'))}${field('diploma','diploma','text',c.diploma||'',false)}${check('hasDoctorate','yes',t('doctorate'))}${field('doctorate','doctorate','text',c.doctorate||'',false)}</div><div class="cv-choice"><strong>💼 ${t('experience').toUpperCase()}</strong>${selectField('experience','experience',[['yes',t('yes')],['no',t('no')]],c.experience||'yes')}</div><label>${t('description')}</label><textarea name="description">${esc(c.description||'')}</textarea><button type="submit" class="btn">💾 ${t('save')}</button></form><div class="cv-actions"><button class="btn green" onclick="downloadCV()">👁 ${t('download')}</button><button class="btn gold" onclick="publishCV(true)">➤ ${t('publishCV')}</button></div>${button(t('unpublish'),"publishCV(false)",'white')}`}
function mustSilent(){return !!user()}
async function saveCV(e){e.preventDefault();const d=formData(e.target),all=db('cvs'),old=all.find(x=>x.owner===userId),file=$('cvPhoto').files[0];if(file){if(file.size>650000)return alertMsg('Chwazi yon foto ki pi piti pase 650 KB.');d.photo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}else d.photo=old?.photo||'';const c={...old,...d,owner:userId,country:user().country,city:user().city,published:old?.published||false};put('cvs',[...all.filter(x=>x.owner!==userId),c]);window.fb.setDoc(window.fb.doc(window.fb.store,'drafts',userId),c).catch(console.error);alertMsg('CV anrejistre.');render()}
async function publishCV(v){const all=db('cvs'),c=all.find(x=>x.owner===userId);if(!c)return alertMsg('Anrejistre CV ou anvan.');const previous=c.published;c.published=v;try{const f=window.fb;await f.setDoc(f.doc(f.store,'drafts',userId),c);if(v){await f.setDoc(f.doc(f.store,'cvs',userId),{...c,id:userId});}else{await f.deleteDoc(f.doc(f.store,'cvs',userId));}put('cvs',all);render()}catch(e){c.published=previous;alertMsg('Firebase: '+e.message);render()}}
